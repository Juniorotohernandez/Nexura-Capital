import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
serverTimestamp,
doc,
getDoc,
updateDoc,
onSnapshot,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====================================================== */
/* FIREBASE CONFIG */
/* ====================================================== */

const firebaseConfig = {


  apiKey: "AIzaSyBDSF0i002CE37zDx9oyc1tnWscLCmOdPE",


  authDomain: "panel-multinivel.firebaseapp.com",


  databaseURL: "https://panel-multinivel-default-rtdb.firebaseio.com",


  projectId: "panel-multinivel",


  storageBucket: "panel-multinivel.firebasestorage.app",


  messagingSenderId: "57838273686",


  appId: "1:57838273686:web:a6ec68314165c0ec23aeb7",


  measurementId: "G-BS7ZT4B5VJ"


};

/* ====================================================== */
/* INIT */
/* ====================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* ====================================================== */
/* LOGIN */
/* ====================================================== */

document.addEventListener("DOMContentLoaded",()=>{

const loginBtn =
document.getElementById("loginBtn");

loginBtn.onclick = async()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(!email || !password){

alert("Completa todos los campos");
return;

}

try{

loginBtn.innerHTML =
`<i class="fa-solid fa-spinner fa-spin"></i> Accediendo`;

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

alert(error.message);

loginBtn.innerHTML =
`Ingresar`;

}

};

});

/* ====================================================== */
/* AUTH STATE */
/* ====================================================== */

onAuthStateChanged(auth, async(user)=>{

if(user){

document.getElementById("loginModal")
.style.display = "none";

document.getElementById("dashboard")
.classList.remove("hidden");

/* ====================================================== */
/* USER DATA */
/* ====================================================== */

const userRef = doc(db,"users",user.uid);

const userSnap = await getDoc(userRef);

let userData = {};

if(userSnap.exists()){

userData = userSnap.data();

}

/* ====================================================== */
/* USER INFO */
/* ====================================================== */

document.getElementById("userName").innerText =
userData.nombre || "Socio Nexura";

document.getElementById("userEmail").innerText =
user.email;

document.getElementById("userInitial").innerText =
(userData.nombre || "N")
.charAt(0)
.toUpperCase();

/* ====================================================== */
/* REF LINK */
/* ====================================================== */

document.getElementById("refLink").value =
`${window.location.origin}/registro.html?ref=${user.uid}`;

/* ====================================================== */
/* REALTIME USER */
/* ====================================================== */

onSnapshot(userRef,(snap)=>{

if(!snap.exists()) return;

const data = snap.data();

const capital = data.capital || 0;

const ganancias = data.ganancias || 0;

const referidos = data.referidosGanancia || 0;

const balance =
capital + ganancias + referidos;

document.getElementById("capital")
.innerText =
capital.toLocaleString("es-HN");

document.getElementById("ganancia")
.innerText =
ganancias.toLocaleString("es-HN");

document.getElementById("referido")
.innerText =
referidos.toLocaleString("es-HN");

document.getElementById("balanceTotal")
.innerText =
balance.toLocaleString("es-HN");

document.getElementById("gananciaReferidos")
.innerText =
"L." + referidos.toLocaleString("es-HN");

document.getElementById("estado")
.innerText =
(data.estado || "Pendiente")
.toUpperCase();

document.getElementById("estadoBox")
.innerText =
(data.estado || "Pendiente")
.toUpperCase();

document.getElementById("totalReferidos")
.innerText =
data.totalReferidos || 0;

/* STATUS COLOR */

const estado =
(data.estado || "").toLowerCase();

const estadoBox =
document.getElementById("estadoBox");

if(estado === "activo"){

estadoBox.className =
"bg-green-500/10 text-green-400 px-5 py-3 rounded-2xl text-sm font-bold";

}else{

estadoBox.className =
"bg-yellow-500/10 text-yellow-400 px-5 py-3 rounded-2xl text-sm font-bold";

}

});

/* ====================================================== */
/* GRAFICO */
/* ====================================================== */

const ctx =
document.getElementById("grafico");

new Chart(ctx,{

type:"line",

data:{

labels:[
"Ene",
"Feb",
"Mar",
"Abr",
"May",
"Jun"
],

datasets:[{

label:"Rendimiento",

data:[
1200,
1900,
3000,
4200,
6000,
8500
],

borderColor:"#f0b90b",

backgroundColor:"rgba(240,185,11,.1)",

fill:true,

tension:.4

}]

},

options:{

responsive:true,

plugins:{

legend:{
display:false
}

},

scales:{

x:{
ticks:{
color:"#64748b"
},
grid:{
color:"#1e2329"
}
},

y:{
ticks:{
color:"#64748b"
},
grid:{
color:"#1e2329"
}
}

}

}

});

<script>

/* PREVIEW GANANCIA */
/* ====================================================== */

document.getElementById("cantidad")
.addEventListener("input",(e)=>{

const valor = Number(e.target.value || 0);

const profit = valor * 0.10;

document.getElementById("previewGanancia").innerText =
"L." + profit.toLocaleString("es-HN");

});

/* ====================================================== */
/* COPIAR LINK */
/* ====================================================== */

document.getElementById("copyBtn")
.onclick = ()=>{

navigator.clipboard.writeText(
document.getElementById("refLink").value
);

alert("Link copiado correctamente");

};

/* ====================================================== */
/* LOGOUT */
/* ====================================================== */

document.getElementById("logoutBtn")
.onclick = ()=>{

signOut(auth);

};

/* ====================================================== */
/* SIDEBAR ACTIVE */
/* ====================================================== */

const links =
document.querySelectorAll(".sidebar-link");

links.forEach(link=>{

link.addEventListener("click",()=>{

links.forEach(l=>
l.classList.remove("active")
);

link.classList.add("active");

});

});
