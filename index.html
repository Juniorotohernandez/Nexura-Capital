<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexura Capital</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020817;
    color:white;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top right, rgba(255,215,0,.15), transparent 25%),
    radial-gradient(circle at bottom left, rgba(255,215,0,.10), transparent 25%),
    linear-gradient(135deg,#020817,#07152d,#020817);
    z-index:-3;
}

.blur1{
    position:fixed;
    width:300px;
    height:300px;
    background:gold;
    opacity:.08;
    filter:blur(120px);
    border-radius:50%;
    top:-100px;
    right:-100px;
    z-index:-2;
}

.blur2{
    position:fixed;
    width:350px;
    height:350px;
    background:#0ea5e9;
    opacity:.08;
    filter:blur(120px);
    border-radius:50%;
    bottom:-100px;
    left:-100px;
    z-index:-2;
}

.auth-container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:480px;
    background:rgba(15,23,42,.85);
    border-radius:30px;
    padding:35px;
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid gold;
    object-fit:cover;
}

.logo h1{
    color:gold;
    margin-top:15px;
    font-size:32px;
    font-weight:800;
}

.logo p{
    color:#94a3b8;
}

.tabs{
    display:flex;
    margin-bottom:25px;
    gap:10px;
}

.tab{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#0f172a;
    color:white;
    cursor:pointer;
    font-weight:700;
}

.tab.active{
    background:gold;
    color:#07152d;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
}

.input-group input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#0f172a;
    color:white;
    outline:none;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:gold;
    color:#07152d;
    font-weight:800;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.loading{
    display:none;
    text-align:center;
    color:gold;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="blur1"></div>
<div class="blur2"></div>

<div class="auth-container">

<div class="auth-box">

<div class="logo">

<img src="Nexura_Capital_logo.png">

<h1>NEXURA</h1>

<p>Capital Investment Platform</p>

</div>

<div class="tabs">

<button class="tab active" id="loginTab">
Iniciar Sesión
</button>

<button class="tab" id="registerTab">
Registrarse
</button>

</div>

<!-- LOGIN -->

<div class="form active" id="loginForm">

<div class="input-group">
<label>Correo Electrónico</label>
<input type="email" id="loginEmail">
</div>

<div class="input-group">
<label>Contraseña</label>
<input type="password" id="loginPassword">
</div>

<button class="btn" id="loginBtn">
Entrar
</button>

</div>

<!-- REGISTER -->

<div class="form" id="registerForm">

<div class="input-group">
<label>Nombre Completo</label>
<input type="text" id="registerName">
</div>

<div class="input-group">
<label>Correo Electrónico</label>
<input type="email" id="registerEmail">
</div>

<div class="input-group">
<label>Número WhatsApp</label>
<input type="text" id="registerWhatsapp">
</div>

<div class="input-group">
<label>Contraseña</label>
<input type="password" id="registerPassword">
</div>

<div class="input-group">
<label>Código de Referido</label>
<input type="text" id="registerRef">
</div>

<button class="btn" id="registerBtn">
Crear Cuenta
</button>

</div>

<div class="loading" id="loading">
Procesando...
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getDatabase,
ref,
set,
get,
update

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyBDSF0i002CE37zDx9oyc1tnWscLCmOdPE",

authDomain: "panel-multinivel.firebaseapp.com",

databaseURL: "https://panel-multinivel-default-rtdb.firebaseio.com",

projectId: "panel-multinivel",

storageBucket: "panel-multinivel.firebasestorage.app",

messagingSenderId: "57838273686",

appId: "1:57838273686:web:a6ec68314165c0ec23aeb7"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

/* EMPRESA REFERIDO */

const COMPANY_REF = "NEXURA-CAPITAL";

/* REFERIDO URL */

const urlParams = new URLSearchParams(window.location.search);

const refCode = urlParams.get("ref");

if(refCode){

document.getElementById("registerRef").value = refCode;

}

/* TABS */

const loginTab = document.getElementById("loginTab");

const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");

const registerForm = document.getElementById("registerForm");

loginTab.onclick = ()=>{

loginTab.classList.add("active");
registerTab.classList.remove("active");

loginForm.classList.add("active");
registerForm.classList.remove("active");

}

registerTab.onclick = ()=>{

registerTab.classList.add("active");
loginTab.classList.remove("active");

registerForm.classList.add("active");
loginForm.classList.remove("active");

}

/* LOGIN */

document.getElementById("loginBtn").onclick = async()=>{

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value.trim();

if(!email || !password){

alert("Completa todos los campos");
return;

}

try{

document.getElementById("loading").style.display = "block";

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const uid = userCredential.user.uid;

const snapshot =
await get(ref(db,"users/" + uid));

if(!snapshot.exists()){

alert("Cuenta no encontrada");

return;

}

const data = snapshot.val();

if(data.active !== true){

alert(
"Tu cuenta está pendiente de activación."
);

return;

}

if(!data.invested || data.invested < 1500){

alert(
"Debes tener una inversión mínima de L1500."
);

return;

}

window.location.href =
"dashboard.html?uid=" + uid;

}catch(error){

alert(error.message);

}

document.getElementById("loading").style.display = "none";

}

/* REGISTRO */

document.getElementById("registerBtn").onclick = async()=>{

const name =
document.getElementById("registerName").value.trim();

const email =
document.getElementById("registerEmail").value.trim();

const whatsapp =
document.getElementById("registerWhatsapp").value.trim();

const password =
document.getElementById("registerPassword").value.trim();

let referral =
document.getElementById("registerRef").value.trim();

if(
!name ||
!email ||
!whatsapp ||
!password
){

alert("Completa todos los campos");
return;

}

if(referral === ""){

referral = COMPANY_REF;

}

try{

document.getElementById("loading").style.display = "block";

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid = userCredential.user.uid;

await set(ref(db,"users/" + uid),{

uid:uid,

name:name,

email:email,

whatsapp:whatsapp,

referralCode:uid,

referredBy:referral,

active:false,

pending:true,

invested:0,

refBonus:0,

createdAt:Date.now(),

status:"Pendiente"

});

/* SI TIENE REFERIDO */

if(referral !== COMPANY_REF){

const refSnapshot =
await get(ref(db,"users"));

if(refSnapshot.exists()){

refSnapshot.forEach(async(child)=>{

const userData = child.val();

if(userData.referralCode === referral){

await update(ref(db,
"referrals/" + child.key + "/" + uid),{

name:name,

email:email,

date:new Date()
.toLocaleDateString("es-HN"),

status:"Pendiente",

invested:0,

commission:0

});

}

});

}

}

alert(
"Cuenta creada correctamente. Espera activación del administrador."
);

location.reload();

}catch(error){

alert(error.message);

}

document.getElementById("loading").style.display = "none";

}

</script>

</body>
</html>
